<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --primary: #32338e;
      --primary-dark: #24256c;
      --background: #f4f5fb;
      --surface: #ffffff;
      --text: #202136;
      --muted: #6c6e82;
      --border: #dfe1eb;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #eef0ff, var(--background) 45%, #f8f8fc);
    }

    main {
      width: min(920px, 100%);
      padding: 32px;
      border: 1px solid rgba(50, 51, 142, .10);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 20px 60px rgba(31, 32, 74, .12);
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.55rem, 4vw, 2.15rem); }
    .intro { margin: 0 0 28px; color: var(--muted); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 32px;
      align-items: start;
    }

    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 20px 0;
      padding: 5px;
      border-radius: 12px;
      background: #f0f1f7;
    }

    .mode-button {
      min-height: 43px;
      padding: 12px 18px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, box-shadow 0.12s, transform 0.08s;
    }

    .mode-button.active {
      color: white;
      background: var(--primary);
      box-shadow: 0 3px 10px rgba(50, 51, 142, 0.18);
    }

    .mode-button:hover:not(.active) {
      background: rgba(50, 51, 142, 0.08);
    }

    form { display: grid; gap: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    [hidden] { display: none !important; }

    label {
      display: grid;
      gap: 7px;
      font-size: .9rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 12px 13px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(50, 51, 142, .12);
    }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

    .result .actions {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 0;
    }

    .result .actions button {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      white-space: nowrap;
      border-radius: 10px;
    }

    button {
      min-height: 43px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: background 0.15s, box-shadow 0.12s, transform 0.08s;
    }

    button:focus-visible,
    .mode-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 6px rgba(50, 51, 142, 0.18);
      transform: translateY(-1px);
    }

    .primary { color: white; background: var(--primary); }
    .primary:hover { background: var(--primary-dark); }
    
    .secondary { 
      color: var(--primary); 
      background: #e8eaff;
      border: 1px solid #d4d7f0;
    }
    
    .secondary:hover { 
      background: #dde1ff;
    }
    
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .result {
      display: grid;
      justify-items: center;
      gap: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fafaff;
    }

    #qrcode {
      min-width: 232px;
      min-height: 232px;
      padding: 12px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: white;
    }

    #qrcode img, #qrcode canvas { max-width: 100%; height: auto !important; }

    .url-box {
      width: 100%;
      padding: 11px;
      overflow-wrap: anywhere;
      border-radius: 8px;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #54556a;
      background: #f0f1f7;
    }

    #message { min-height: 20px; margin: 0; font-size: .88rem; color: var(--danger); }

    @media (max-width: 760px) {
      body {
        padding: 10px;
        place-items: start center;
      }

      main {
        padding: 16px;
        border-radius: 15px;
      }

      h1 {
        margin-bottom: 4px;
        font-size: 1.35rem;
      }

      .mode-selector {
        margin: 12px 0;
        padding: 4px;
      }

      .mode-button {
        min-height: 38px;
        padding: 10px 12px;
        font-size: .86rem;
      }

      .intro {
        margin-bottom: 16px;
        font-size: .88rem;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      form { gap: 11px; }
      .row { gap: 10px; }

      label {
        gap: 5px;
        font-size: .82rem;
      }

      input {
        padding: 9px 10px;
        border-radius: 8px;
        font-size: .92rem;
      }

      textarea {
        min-height: 105px;
        padding: 9px 10px;
        font-size: .92rem;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 2px;
      }

      .actions .primary { grid-column: 1 / -1; }

      button {
        min-height: 38px;
        padding: 8px 10px;
        font-size: .86rem;
      }

      .result {
        gap: 10px;
        padding: 13px;
      }

      .result .actions {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .result .actions .primary {
        grid-column: 1 / -1;
      }

      #qrcode {
        width: 100%;
        min-width: 0;
        min-height: 0;
        aspect-ratio: 1;
        padding: 8px;
      }

      #qrcode img,
      #qrcode canvas {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 1;
      }

      .url-box {
        padding: 8px;
        font-size: 10px;
      }

      #message {
        min-height: 16px;
        font-size: .8rem;
      }
    }

    @media (max-width: 370px) {
      body { padding: 6px; }
      main { padding: 11px; }

      .row {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 7px;
      }

      .row label {
        min-width: 0;
        font-size: .75rem;
      }

      .row input {
        min-width: 0;
        padding: 8px;
        font-size: .86rem;
      }

      .mode-button {
        padding-inline: 6px;
        font-size: .8rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gerador de QR Code</h1>

    <div class="mode-selector" role="tablist" aria-label="Tipo de QR Code">
      <button class="mode-button active" id="cardapioMode" type="button" role="tab" aria-selected="true" aria-controls="qrForm">Link do cardápio</button>
      <button class="mode-button" id="textMode" type="button" role="tab" aria-selected="false" aria-controls="textForm">Texto puro</button>
    </div>

    <div class="layout">
      <form id="qrForm" role="tabpanel" aria-labelledby="cardapioMode" aria-hidden="false">
        <label>
          Endereço-base
          <input id="baseUrl" type="url" value="http://teste.qualitysys.com.br:7789" placeholder="https://seusite.com.br:1234" required>
        </label>

        <div class="row">
          <label>
            ID do POS
            <input id="idPos" type="tel" inputmode="numeric" value="4" placeholder="4" required>
          </label>
          <label>
            Mesa
            <input id="mesa" type="tel" inputmode="numeric" value="1" placeholder="1" required>
          </label>
        </div>

        <label>
          Número da comanda
          <input id="numeroComanda" type="tel" inputmode="numeric" value="111" placeholder="111" required>
        </label>

        <p id="message" role="alert" aria-live="polite"></p>
      </form>

      <form id="textForm" hidden role="tabpanel" aria-labelledby="textMode" aria-hidden="true">
        <label>
          Texto do QR Code
          <textarea id="plainText" placeholder="Digite qualquer texto aqui..." required></textarea>
        </label>

        <p id="textMessage" role="alert" aria-live="polite"></p>
      </form>

      <section class="result" aria-label="Resultado">
        <div id="qrcode" aria-label="QR Code gerado"></div>
        <div class="url-box" id="generatedContent">O conteúdo gerado aparecerá aqui.</div>
        <div class="actions">
          <button class="secondary" id="copyButton" type="button" disabled>Copiar link</button>
          <button class="secondary" id="downloadButton" type="button" disabled>Baixar PNG</button>
          <button class="primary" id="openButton" type="button" disabled>Abrir link</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("qrForm");
    const textForm = document.getElementById("textForm");
    const qrContainer = document.getElementById("qrcode");
    const generatedContent = document.getElementById("generatedContent");
    const message = document.getElementById("message");
    const textMessage = document.getElementById("textMessage");
    const copyButton = document.getElementById("copyButton");
    const downloadButton = document.getElementById("downloadButton");
    const openButton = document.getElementById("openButton");
    const cardapioMode = document.getElementById("cardapioMode");
    const textMode = document.getElementById("textMode");
    let currentMode = "cardapio";

    function setMode(mode) {
      currentMode = mode;
      const isCardapio = mode === "cardapio";
      form.hidden = !isCardapio;
      textForm.hidden = isCardapio;
      cardapioMode.classList.toggle("active", isCardapio);
      textMode.classList.toggle("active", !isCardapio);
      cardapioMode.setAttribute("aria-selected", String(isCardapio));
      textMode.setAttribute("aria-selected", String(!isCardapio));
      form.setAttribute("aria-hidden", String(!isCardapio));
      textForm.setAttribute("aria-hidden", String(isCardapio));

      copyButton.textContent = isCardapio
        ? "Copiar link"
        : "Copiar texto";
      message.textContent = "";
      textMessage.textContent = "";
      if (isCardapio) {
        generateQr();
      } else {
        generateTextQr();
      }
    }

    function buildUrl() {
      const base = document.getElementById("baseUrl").value.trim();
      const values = {
        idPos: document.getElementById("idPos").value.trim(),
        mesa: document.getElementById("mesa").value.trim(),
        numeroComanda: document.getElementById("numeroComanda").value.trim()
      };

      const requiredValues = [
        values.idPos,
        values.mesa,
        values.numeroComanda
      ];

      if (!base || requiredValues.some(value => !value)) {
        throw new Error("Preencha todos os campos.");
      }

      let url;
      try {
        url = new URL(base);
      } catch {
        throw new Error("Informe um endereço-base válido, incluindo http:// ou https://.");
      }

      url.pathname = url.pathname.replace(/\/+$/, "") + "/cardapioDigital";
      url.search = "";
      url.hash = "";
      Object.entries(values).forEach(([key, value]) => url.searchParams.set(key, value));
      return url.toString();
    }

    function generateQr(event) {
      if (event) event.preventDefault();
      message.textContent = "";

      try {
        const url = buildUrl();
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
          text: url,
          width: 208,
          height: 208,
          colorDark: "#111111",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
        generatedContent.textContent = url;
        copyButton.disabled = false;
        downloadButton.disabled = false;
        openButton.disabled = false;
      } catch (error) {
        qrContainer.innerHTML = "";
        generatedContent.textContent = "A URL gerada aparecerá aqui.";
        copyButton.disabled = true;
        downloadButton.disabled = true;
        openButton.disabled = true;
        message.textContent = error.message;
      }
    }

    form.addEventListener("submit", generateQr);
    form.addEventListener("input", generateQr);

    function generateTextQr(event) {
      if (event) event.preventDefault();
      textMessage.textContent = "";
      const text = document.getElementById("plainText").value;

      if (!text.trim()) {
        qrContainer.innerHTML = "";
        generatedContent.textContent = "O texto gerado aparecerá aqui.";
        copyButton.disabled = true;
        downloadButton.disabled = true;
        openButton.disabled = true;
        textMessage.textContent = "Digite um texto para gerar o QR Code.";
        return;
      }

      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text,
        width: 208,
        height: 208,
        colorDark: "#111111",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      generatedContent.textContent = text;
      copyButton.disabled = false;
      downloadButton.disabled = false;
      openButton.disabled = true;
    }

    textForm.addEventListener("submit", generateTextQr);
    textForm.addEventListener("input", generateTextQr);

    cardapioMode.addEventListener("click", () => setMode("cardapio"));
    textMode.addEventListener("click", () => setMode("texto"));

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(generatedContent.textContent);
        copyButton.textContent = "Copiado!";
        setTimeout(() => {
          copyButton.textContent = currentMode === "cardapio"
            ? "Copiar link"
            : "Copiar texto";
        }, 1600);
      } catch {
        const targetMessage = currentMode === "cardapio" ? message : textMessage;
        targetMessage.textContent = "Não foi possível copiar automaticamente. Selecione o conteúdo exibido e copie manualmente.";
      }
    });

    downloadButton.addEventListener("click", () => {
      const image = qrContainer.querySelector("img");
      const canvas = qrContainer.querySelector("canvas");
      const source = image?.src || canvas?.toDataURL("image/png");

      if (!source) return;
      const link = document.createElement("a");
      link.href = source;
      link.download = currentMode === "cardapio" ? "qrcode-cardapio.png" : "qrcode-texto.png";
      link.click();
    });

    openButton.addEventListener("click", () => {
      const content = generatedContent.textContent?.trim();
      if (!content) return;
      try {
        const url = new URL(content);
        window.open(url.toString(), "_blank", "noopener");
      } catch {
        const targetMessage = currentMode === "cardapio" ? message : textMessage;
        targetMessage.textContent = "O conteúdo gerado não é um link válido.";
      }
    });

    window.addEventListener("load", generateQr);
  </script>
</body>
</html>
